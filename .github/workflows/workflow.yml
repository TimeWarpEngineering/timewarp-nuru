name: CI/CD

on:
  push:
    branches:
      - master
    # Non-code paths (task 537). A push that changes only these paths gets no
    # run at all. That is deliberate: a run with the build skipped would still
    # conclude success, and `dev release` (step 8) and release-mode locate-run
    # treat a successful push run at the tag sha as tested, with a Packages-*
    # artifact. No run keeps that true. Required checks gate pull requests, not
    # pushes, so nothing waits on a missing push run. Pull requests use the
    # `changes` job below, which reads this list, so the list lives only here.
    # Use `dir/**` or exact file names; the gate matches them as bash globs.
    # readme.md and assets/logo.png are packed into the nupkgs, so they stay code.
    paths-ignore:
      - 'kanban/**'
      - 'documentation/**'
      - 'skills/**'
      - '.agent/**'
      - '.claude/**'
      - 'assets/mascot/**'
      - 'assets/timewarp-nuru-avatar.svg'
      - 'changelog.md'
  pull_request:
    branches:
      - master
      - 'feature/**'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pipeline mode. merge = build and test only (default). release = break-glass publish; also requires confirm. probe = trusted-publishing check only (OIDC login, no build, no publish).'
        type: choice
        options:
          - merge
          - release
          - probe
        default: merge
      confirm:
        description: 'Break-glass guard: type the word release to confirm publishing when mode is release. Ignored otherwise.'
        type: string
        default: ''

# Superseded pull request runs are cancelled. Every other event gets a group of
# its own (run_id), so master, release and dispatch runs are never cancelled or
# queued behind one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Path gate for pull requests (task 537). Sets code=false only when every
    # file the PR changes (and every rename source) matches push.paths-ignore.
    # Any other event, or any failure here, means code=true. `ci` is the
    # required check; a skipped job reports success, so a kanban-only PR stays
    # mergeable without a build. release and workflow_dispatch are never gated.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.gate.outputs.code }}
    steps:
      - name: Checkout workflow file
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/workflows/workflow.yml
          sparse-checkout-cone-mode: false

      - name: Classify changed paths
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Event ${EVENT_NAME} is never path-gated: full build."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t patterns < <(yq -r '.on.push."paths-ignore"[]' .github/workflows/workflow.yml)
          if [ "${#patterns[@]}" -eq 0 ]; then
            echo "::warning::No push.paths-ignore patterns read from workflow.yml; building."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t files < <(gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[] | .filename, (.previous_filename // empty)')
          # The files API stops at 3000 entries. A short list could hide code.
          if [ "${#files[@]}" -eq 0 ] || [ "${#files[@]}" -lt "$PR_CHANGED_FILES" ]; then
            echo "Listed ${#files[@]} of ${PR_CHANGED_FILES} changed files; building."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for f in "${files[@]}"; do
            matched=false
            for p in "${patterns[@]}"; do
              # Unquoted on purpose: glob match, and * crosses / in [[ ]].
              # shellcheck disable=SC2053
              if [[ "$f" == $p ]]; then matched=true; break; fi
            done
            if [ "$matched" = false ]; then
              echo "Code path changed: ${f}. Full build."
              echo "code=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "All ${#files[@]} changed paths are non-code (${patterns[*]}). Skipping the build."
          echo "code=false" >> "$GITHUB_OUTPUT"

  ci:
    needs: changes
    # Only an explicit code=false skips. A failed or missing gate still builds.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for NuGet Trusted Publishing (OIDC)
      # write: keep-last-two prune deletes older Packages-* artifacts.
      # Release-mode list/download still works with write (superset of read).
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history required for the release gate's tag/ancestor checks (git merge-base, tag-pin, ls-remote comparisons)

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          # Global-packages cache. The key is package manifests, so a source-only
          # change restores packages and restore downloads anything new.
          # The file-based runfile directory is not cached: the SDK skips a rebuild
          # from source mtimes versus build-success.cache, and checkout stamps
          # sources at checkout time, so a restored cache either misses or can
          # skip work that should run. Local invalidation stays
          # `ganda runfile cache --clear`.
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json
            nuget.config
            **/*.csproj

      - name: Runner size
        run: nproc && free -h

      - name: Validate break-glass confirmation
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'release' && inputs.confirm != 'release'
        run: |
          echo "::error::mode=release requires confirm=release. Refusing to run a break-glass release."
          exit 1

      - name: NuGet login (OIDC Trusted Publishing)
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release' && inputs.confirm == 'release') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'probe')
        id: nuget-login
        uses: nuget/login@v1
        with:
          user: TimeWarp.Enterprises

      - name: Trusted publishing probe result
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'probe'
        run: echo "Trusted publishing OK — OIDC exchange succeeded for this repo + workflow.yml. (A failure of the NuGet login step above means the policy is missing or misconfigured on NuGet.org.)"

      - name: Install zsh
        # completion-31 drives a fresh zsh (fpath autoload and zpty Tab). The runner image does not ship zsh.
        run: |
          if ! command -v zsh >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y zsh
          fi

      - name: Run CI Pipeline
        if: github.event_name != 'workflow_dispatch' || inputs.mode != 'probe'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            dotnet run --file tools/dev-cli/dev.cs -- workflow --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          elif [ "${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'release' && inputs.confirm == 'release' }}" == "true" ]; then
            dotnet run --file tools/dev-cli/dev.cs -- workflow --mode release --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          else
            dotnet run --file tools/dev-cli/dev.cs -- workflow
          fi

      - name: Upload Artifacts
        # Green master only: 458-002 promotes Packages-* from a push run at the
        # tag SHA. PR / always() uploads filled the org quota. Skip failed runs,
        # probe (no nupkgs), and release-mode re-upload (the run just downloaded
        # the same bytes).
        id: upload-packages
        if: >-
          success() &&
          github.ref == 'refs/heads/master' &&
          github.event_name != 'release' &&
          !(github.event_name == 'workflow_dispatch' && (inputs.mode == 'release' || inputs.mode == 'probe'))
        uses: actions/upload-artifact@v7
        with:
          name: Packages-${{ github.run_number }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
          retention-days: 7

      - name: Keep last two Packages artifacts
        if: success() && steps.upload-packages.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT: Packages-${{ github.run_number }}
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select((.name | startswith("Packages-")) and (.expired == false)) | [.created_at, (.id | tostring), .name] | @tsv' \
            | LC_ALL=C sort -r > "$tmp"
          if ! cut -f3 "$tmp" | grep -qxF "$EXPECTED_ARTIFACT"; then
            echo "Just-uploaded artifact ${EXPECTED_ARTIFACT} is not listed yet; skipping prune (keep-last-2 runs on the next green master push)."
            exit 0
          fi
          keep=2
          n=0
          while IFS=$'\t' read -r created_at id name; do
            [ -n "$id" ] || continue
            n=$((n + 1))
            if [ "$n" -le "$keep" ]; then
              echo "Keeping ${name} (id=${id}, created=${created_at})"
              continue
            fi
            echo "Deleting ${name} (id=${id}, created=${created_at})"
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
          done < "$tmp"
