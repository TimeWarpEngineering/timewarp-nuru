name: CI/CD

on:
  push:
    branches:
      - master
    # Non-code paths (task 537). A push that changes only these paths gets no
    # run at all. That is deliberate: a run with the build skipped would still
    # conclude success, and `dev release` (step 8) and release-mode locate-run
    # treat a successful push run at the tag sha as tested, with a Packages-*
    # artifact. No run keeps that true. Required checks gate pull requests, not
    # pushes, so nothing waits on a missing push run. Pull requests use the
    # `changes` job below, which reads this list, so the list lives only here.
    # Use `dir/**` or exact file names; the gate matches them as bash globs.
    # readme.md and assets/logo.png are packed into the nupkgs, so they stay code.
    paths-ignore:
      - 'kanban/**'
      - 'documentation/**'
      - 'skills/**'
      - '.agent/**'
      - '.claude/**'
      - 'assets/mascot/**'
      - 'assets/timewarp-nuru-avatar.svg'
      - 'changelog.md'
  pull_request:
    branches:
      - master
      - 'feature/**'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pipeline mode. merge = build and test only (default). release = break-glass publish; also requires confirm. probe = trusted-publishing check only (OIDC login, no build, no publish).'
        type: choice
        options:
          - merge
          - release
          - probe
        default: merge
      confirm:
        description: 'Break-glass guard: type the word release to confirm publishing when mode is release. Ignored otherwise.'
        type: string
        default: ''

# Superseded pull request runs are cancelled. Every other event gets a group of
# its own (run_id), so master, release and dispatch runs are never cancelled or
# queued behind one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: pwsh

jobs:
  changes:
    # Path gate for pull requests (task 537). Sets code=false only when every
    # file the PR changes (and every rename source) matches push.paths-ignore.
    # Any other event, or any failure here, means code=true. `ci` is the
    # required check; a skipped job reports success, so a kanban-only PR stays
    # mergeable without a build (the stage jobs skip too). release and
    # workflow_dispatch are never gated.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.gate.outputs.code }}
    steps:
      - name: Checkout workflow file
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/workflows/workflow.yml
          sparse-checkout-cone-mode: false

      - name: Classify changed paths
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EVENT_NAME -ne 'pull_request') {
            Write-Output "Event $($env:EVENT_NAME) is never path-gated: full build."
            Write-Output 'code=true' >> $env:GITHUB_OUTPUT
            exit 0
          }

          $patterns = @(yq -r '.on.push."paths-ignore"[]' .github/workflows/workflow.yml | Where-Object { $_ })
          if ($LASTEXITCODE -ne 0) { throw 'yq failed to read push.paths-ignore.' }
          if ($patterns.Count -eq 0) {
            Write-Output '::warning::No push.paths-ignore patterns read from workflow.yml; building.'
            Write-Output 'code=true' >> $env:GITHUB_OUTPUT
            exit 0
          }

          $files = @(gh api --paginate "/repos/$($env:GITHUB_REPOSITORY)/pulls/$($env:PR_NUMBER)/files?per_page=100" `
            --jq '.[] | .filename, (.previous_filename // empty)' | Where-Object { $_ })
          if ($LASTEXITCODE -ne 0) { throw 'gh api failed to list the PR files.' }
          # The files API stops at 3000 entries. A short list could hide code.
          if ($files.Count -eq 0 -or $files.Count -lt [int]$env:PR_CHANGED_FILES) {
            Write-Output "Listed $($files.Count) of $($env:PR_CHANGED_FILES) changed files; building."
            Write-Output 'code=true' >> $env:GITHUB_OUTPUT
            exit 0
          }

          # Glob to regex with bash [[ == ]] unquoted semantics: * and ** cross /, ? is one char.
          $regexes = foreach ($p in $patterns) {
            $r = [regex]::Escape($p)
            $r = $r.Replace('\*\*', '.*').Replace('\*', '.*').Replace('\?', '.')
            "^$r$"
          }

          foreach ($f in $files) {
            $matched = $false
            foreach ($r in $regexes) {
              if ($f -match $r) { $matched = $true; break }
            }
            if (-not $matched) {
              Write-Output "Code path changed: $f. Full build."
              Write-Output 'code=true' >> $env:GITHUB_OUTPUT
              exit 0
            }
          }

          Write-Output "All $($files.Count) changed paths are non-code ($($patterns -join ' ')). Skipping the build."
          Write-Output 'code=false' >> $env:GITHUB_OUTPUT

  stage:
    # The PR/merge pipeline as parallel jobs (task 538): build (pack plus the
    # package gates), samples, and the two test phases. Each job is its own
    # runner, so samples and tests cannot touch the packages the build job
    # verified. Release and probe runs build nothing (the release job).
    # Only an explicit code=false skips. A failed or missing gate still builds.
    name: ${{ matrix.stage }}
    needs: changes
    if: >-
      ${{ !cancelled() && needs.changes.outputs.code != 'false' &&
      github.event_name != 'release' &&
      !(github.event_name == 'workflow_dispatch' && inputs.mode != 'merge') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # Report every stage. A samples failure no longer hides the tests.
      fail-fast: false
      matrix:
        stage: [build, samples, test-multi, test-standalone]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history: attestation notes, version and tag checks

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Runner size
        run: nproc && free -h

      - name: Read OS codename
        # completion-31 (multi-mode phase) drives a fresh zsh, which the runner
        # image does not ship. The apt mirror sometimes serves the debs at
        # 60 kB/s (1.5 to 5 minutes), so the debs are cached.
        if: matrix.stage == 'test-multi'
        id: os
        run: |
          $ErrorActionPreference = 'Stop'
          $line = Get-Content /etc/os-release | Where-Object { $_ -match '^VERSION_CODENAME=' } | Select-Object -First 1
          $codename = ''
          if ($line) { $codename = ($line -replace '^VERSION_CODENAME=', '').Trim('"', "'") }
          Write-Output "codename=$codename" >> $env:GITHUB_OUTPUT

      - name: Cache zsh packages
        if: matrix.stage == 'test-multi'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/zsh-debs
          key: zsh-debs-${{ runner.os }}-${{ runner.arch }}-${{ steps.os.outputs.codename }}-v1

      - name: Install zsh
        if: matrix.stage == 'test-multi'
        env:
          DEBS: ${{ runner.temp }}/zsh-debs
        run: |
          $ErrorActionPreference = 'Stop'
          if (Get-Command zsh -ErrorAction SilentlyContinue) {
            Write-Output 'zsh is already installed.'
            exit 0
          }
          $debs = @(Get-ChildItem -Path $env:DEBS -Filter '*.deb' -ErrorAction SilentlyContinue)
          if ($debs.Count -gt 0) {
            sudo dpkg -i @($debs.FullName)
            if ($LASTEXITCODE -eq 0) {
              Write-Output 'Installed zsh from the cached packages.'
              exit 0
            }
          }
          Write-Output 'No usable cached zsh packages; installing from apt.'
          sudo apt-get update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -Recurse -Force -Path $env:DEBS -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $env:DEBS | Out-Null
          Push-Location $env:DEBS
          try {
            apt-get download zsh zsh-common
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
          $downloaded = @(Get-ChildItem -Path $env:DEBS -Filter '*.deb')
          sudo apt-get install -y @($downloaded.FullName)
          exit $LASTEXITCODE

      - name: Install dotnet-coverage
        # The test legs collect Cobertura through Jaribu runfile coverage
        # (task 574): `dev workflow` sets JARIBU_COVERAGE=1 under GitHub Actions
        # and RunAllTests relaunches the runner under dotnet-coverage.
        if: startsWith(matrix.stage, 'test-')
        run: |
          dotnet tool install --global dotnet-coverage
          exit $LASTEXITCODE

      - name: Run CI stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: dotnet run --file tools/dev-cli/dev.cs -- workflow --stage ${{ matrix.stage }}

      - name: Upload coverage
        # One artifact per test leg so the two legs do not collide.
        # Line-rate gate (ci-code-coverage.min-line) is not set yet (task 574).
        if: success() && startsWith(matrix.stage, 'test-')
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.stage }}
          path: artifacts/coverage
          if-no-files-found: warn

      - name: DevCli consumer check
        # DevCli ships C# source that consumers compile with their own analyzers.
        # Nuru builds it under its own .editorconfig, so RCS1194 (hidden there)
        # reached consumers first (tasks 558, 562). The check compiles the
        # content as a consumer would, without the repo .editorconfig and with
        # CA1812 on (task 573).
        if: matrix.stage == 'samples'
        working-directory: tests/devcli-consumer-check
        run: dotnet build

      - name: Stage packages for the ci job
        # Green master only (see the ci job). The ci job uploads these bytes as
        # Packages-<run_number> once every stage passed, then deletes this one.
        # The name must not start with Packages-: release locate-run takes any
        # Packages-* artifact of a successful run.
        if: matrix.stage == 'build' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: staged-packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
          # Kept for `gh run rerun --failed` of a red run; a green run deletes it.
          retention-days: 3

  ci:
    # Required check. Needs every stage and fails unless all of them passed.
    # Skipped exactly when changes says code=false (a skipped job reports
    # success) and on release and probe runs, which have no stages. always()
    # rather than !cancelled(): a cancelled run must fail this check, not skip it.
    needs: [changes, stage]
    if: >-
      ${{ always() && needs.changes.outputs.code != 'false' &&
      github.event_name != 'release' &&
      !(github.event_name == 'workflow_dispatch' && inputs.mode != 'merge') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write: keep-last-two prune deletes older Packages-* artifacts and the
      # staged-packages artifact.
      actions: write

    steps:
      - name: Require every stage
        env:
          STAGE_RESULT: ${{ needs.stage.result }}
        run: |
          Write-Output "stage result: $($env:STAGE_RESULT)"
          if ($env:STAGE_RESULT -ne 'success') {
            Write-Output "::error::A CI stage did not succeed ($($env:STAGE_RESULT))."
            exit 1
          }

      - name: Download staged packages
        if: github.ref == 'refs/heads/master'
        uses: actions/download-artifact@v8
        with:
          name: staged-packages
          path: artifacts/packages

      - name: Upload Artifacts
        # Green master only: 458-002 promotes Packages-* from a push run at the
        # tag SHA. PR / always() uploads filled the org quota. Failed runs never
        # reach this step; release and probe runs have no ci job. The bytes are
        # the build stage's verified Release packages.
        id: upload-packages
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: Packages-${{ github.run_number }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
          retention-days: 7

      - name: Keep last two Packages artifacts
        if: success() && steps.upload-packages.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT: Packages-${{ github.run_number }}
        run: |
          $ErrorActionPreference = 'Stop'
          $query = '.artifacts[] | select((.name | startswith("Packages-")) and (.expired == false)) | {created_at, id, name} | tojson'
          $listed = gh api --paginate -H 'Accept: application/vnd.github+json' "/repos/$($env:GITHUB_REPOSITORY)/actions/artifacts?per_page=100" --jq $query
          if ($LASTEXITCODE -ne 0) { throw 'gh api failed to list the Actions artifacts.' }
          $artifacts = @($listed | Where-Object { $_ } | ForEach-Object { $_ | ConvertFrom-Json })
          if (-not ($artifacts | Where-Object { $_.name -eq $env:EXPECTED_ARTIFACT })) {
            Write-Output "Just-uploaded artifact $($env:EXPECTED_ARTIFACT) is not listed yet; skipping prune (keep-last-2 runs on the next green master push)."
            exit 0
          }
          $keep = 2
          $sorted = @($artifacts | Sort-Object -Property @{ Expression = { [datetime]$_.created_at }; Descending = $true }, @{ Expression = { [long]$_.id }; Descending = $true })
          for ($index = 0; $index -lt $sorted.Count; $index++) {
            $artifact = $sorted[$index]
            if ($index -lt $keep) {
              Write-Output "Keeping $($artifact.name) (id=$($artifact.id), created=$($artifact.created_at))"
              continue
            }
            Write-Output "Deleting $($artifact.name) (id=$($artifact.id), created=$($artifact.created_at))"
            gh api --method DELETE "/repos/$($env:GITHUB_REPOSITORY)/actions/artifacts/$($artifact.id)" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Delete of $($artifact.name) (id=$($artifact.id)) failed." }
          }

      - name: Delete staged packages
        # Storage only; a leftover expires with its retention.
        if: success() && steps.upload-packages.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ids = @(gh api "/repos/$($env:GITHUB_REPOSITORY)/actions/runs/$($env:RUN_ID)/artifacts?per_page=100" `
            --jq '.artifacts[] | select(.name == "staged-packages") | .id' | Where-Object { $_ })
          if ($LASTEXITCODE -ne 0) { throw 'gh api failed to list the run artifacts.' }
          foreach ($id in $ids) {
            Write-Output "Deleting staged-packages (id=$id)"
            gh api --method DELETE "/repos/$($env:GITHUB_REPOSITORY)/actions/artifacts/$id"
            if ($LASTEXITCODE -ne 0) { throw "Delete of staged-packages (id=$id) failed." }
          }

  release:
    # Release event, break-glass dispatch (mode=release) and the trusted
    # publishing probe. Release mode builds nothing: it promotes the Packages-*
    # artifact from the successful CI run of the tagged commit.
    if: >-
      ${{ github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'release' || inputs.mode == 'probe')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for NuGet Trusted Publishing (OIDC)
      actions: read    # locate-run lists runs and downloads the Packages-* artifact

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history required for the release gate's tag/ancestor checks (git merge-base, tag-pin, ls-remote comparisons)

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Validate break-glass confirmation
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'release' && inputs.confirm != 'release'
        run: |
          echo "::error::mode=release requires confirm=release. Refusing to run a break-glass release."
          exit 1

      - name: NuGet login (OIDC Trusted Publishing)
        id: nuget-login
        uses: nuget/login@v1
        with:
          user: TimeWarp.Enterprises

      - name: Trusted publishing probe result
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'probe'
        run: echo "Trusted publishing OK — OIDC exchange succeeded for this repo + workflow.yml. (A failure of the NuGet login step above means the policy is missing or misconfigured on NuGet.org.)"

      - name: Run release pipeline
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release' && inputs.confirm == 'release')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ('${{ github.event_name }}' -eq 'release') {
            dotnet run --file tools/dev-cli/dev.cs -- workflow --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          } else {
            dotnet run --file tools/dev-cli/dev.cs -- workflow --mode release --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          }
          exit $LASTEXITCODE
