name: Install PowerShell
description: >
  Put pwsh on PATH when the runner does not have it. The wslc image is the
  .NET SDK on Ubuntu (bash, no pwsh, no sudo). Workflow run steps use pwsh,
  so the stage job calls this before those steps (task 539). Hosted runners
  skip the caller. PowerShell 7.7.0's dotnet global tool does not install:
  NuGet has no powershell.linux-x64 pack (PowerShell issue 28392).

runs:
  using: composite
  steps:
    - name: Extract PowerShell
      shell: bash
      env:
        PWSH_VERSION: '7.7.0'
        PWSH_SHA256: c89d9c682d2c403dfe726f3df948e359675235a5bd6fab535776de69729ca0cb
      run: |
        set -euo pipefail
        if command -v pwsh >/dev/null 2>&1; then
          echo "pwsh is already installed: $(pwsh -NoLogo -Command '$PSVersionTable.PSVersion.ToString()')"
          exit 0
        fi
        archive="powershell-${PWSH_VERSION}-linux-x64.tar.gz"
        url="https://github.com/PowerShell/PowerShell/releases/download/v${PWSH_VERSION}/${archive}"
        dest="${HOME}/.local/powershell"
        mkdir -p "${dest}" "${HOME}/.local/bin"
        curl -fsSL -o "/tmp/${archive}" "${url}"
        echo "${PWSH_SHA256}  /tmp/${archive}" | sha256sum -c -
        tar -xzf "/tmp/${archive}" -C "${dest}"
        ln -sfn "${dest}/pwsh" "${HOME}/.local/bin/pwsh"
        echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
        pwsh -NoLogo -Command 'Write-Output "Installed $($PSVersionTable.PSVersion)"'
