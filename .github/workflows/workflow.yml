name: CI/CD

on:
  push:
    branches:
      - master
    # Non-code paths (task 537). A push that changes only these paths gets no
    # run at all. That is deliberate: a run with the build skipped would still
    # conclude success, and `dev release` (step 8) and release-mode locate-run
    # treat a successful push run at the tag sha as tested, with a Packages-*
    # artifact. No run keeps that true. Required checks gate pull requests, not
    # pushes, so nothing waits on a missing push run. Pull requests do not
    # read this list: the `changes` job below runs PullRequestBuildClassifier
    # (task 595) with the additions in .timewarp/dev.jsonc pullRequestBuild.
    # readme.md and assets/logo.png are packed into the nupkgs, so they stay
    # code here and are pullRequestBuild.buildPaths there.
    paths-ignore:
      - 'kanban/**'
      - 'documentation/**'
      - 'skills/**'
      - '.agent/**'
      - '.claude/**'
      - 'assets/mascot/**'
      - 'assets/timewarp-nuru-avatar.svg'
      - 'changelog.md'
  pull_request:
    branches:
      - master
      - 'feature/**'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pipeline mode. merge = build and test only (default). release = break-glass publish; also requires confirm. probe = trusted-publishing check only (OIDC login, no build, no publish).'
        type: choice
        options:
          - merge
          - release
          - probe
        default: merge
      confirm:
        description: 'Break-glass guard: type the word release to confirm publishing when mode is release. Ignored otherwise.'
        type: string
        default: ''

# Superseded pull request runs are cancelled. Every other event gets a group of
# its own (run_id), so master, release and dispatch runs are never cancelled or
# queued behind one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: pwsh

jobs:
  changes:
    # Pull request build decision (task 595, fleet standard from timewarp-ganda
    # 476/479/565/587). `dev workflow --stage classify` runs
    # PullRequestBuildClassifier (TimeWarp.Nuru.DevCli content) and writes
    # code=false only when every changed path is a declared non-build path.
    # The rule and this repo's additions (.timewarp/dev.jsonc pullRequestBuild)
    # live in C#, not here. Only pull requests are classified; every other
    # event, and any failure here, means code=true. `ci` is the required check;
    # a skipped job reports success, so a kanban-only PR stays mergeable
    # without a build (the stage jobs skip too). The pull_request trigger has
    # no paths filter, so every pull request reports `ci`.
    # Same runner choice as the stage jobs (see the comment there).
    runs-on: >-
      ${{ vars.CI_HOSTED_ONLY != 'true' &&
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
      fromJSON('["self-hosted", "twe-001", "wslc"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
      # read: the classify step looks up green-key markers (task 540). It does not upload.
      actions: read
    outputs:
      code: ${{ steps.gate.outputs.code || 'true' }}
      # Empty when this job did not classify (push, release, dispatch). The ci
      # job then reads the parallel green-key job. Do not default these to a
      # non-empty value: a string default is truthy and would hide that job.
      green_key: ${{ steps.gate.outputs.green_key }}
      green_key_writer: ${{ steps.gate.outputs.green_key_writer }}
      green_key_earlier: ${{ steps.gate.outputs.green_key_earlier }}
    steps:
      - name: Checkout repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # git diff base...head needs the merge base

      - name: Setup .NET
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/setup-dotnet
        with:
          nuget-cache: ${{ runner.environment == 'github-hosted' }}

      - name: Classify changed paths
        # Also logs the green key (task 540). Same compile and same runner as
        # the stages, so the key matches. Shadow mode: log only, skip nothing.
        id: gate
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: dotnet run --file tools/dev-cli/dev.cs -- workflow --stage classify

  green-key:
    # Shadow ledger for every event the changes job does not classify (task 540).
    # Pull requests observe inside classify. This job does not need changes, so a
    # push does not wait on the dev-cli compile before the stage matrix. A push
    # uses the wslc stage runners: a key hashed on ubuntu-latest would never
    # match a wslc stage. This job does not run for a pull request, so the
    # runner expression has no pull_request clause. continue-on-error: a failure
    # here must not fail the workflow run. dev release lists only successful
    # runs, and a red conclusion would hide a green Packages-* upload.
    # Shadow mode logs hit or miss and does not skip.
    if: github.event_name != 'pull_request'
    continue-on-error: true
    runs-on: >-
      ${{ vars.CI_HOSTED_ONLY != 'true' &&
      github.event_name == 'push' &&
      fromJSON('["self-hosted", "twe-001", "wslc"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
      actions: read
    outputs:
      green_key: ${{ steps.observe.outputs.green_key }}
      green_key_writer: ${{ steps.observe.outputs.green_key_writer }}
      green_key_earlier: ${{ steps.observe.outputs.green_key_earlier }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
        with:
          nuget-cache: ${{ runner.environment == 'github-hosted' }}

      - name: Observe green key
        id: observe
        env:
          GH_TOKEN: ${{ github.token }}
        run: dotnet run --file tools/dev-cli/dev.cs -- workflow --stage green-key

  stage:
    # The PR/merge pipeline as parallel jobs (task 538): build (pack plus the
    # package gates), samples, and the two test phases. Each job is its own
    # runner, so samples and tests cannot touch the packages the build job
    # verified. Release and probe runs build nothing (the release job).
    # Only an explicit code=false skips. A failed or missing gate still builds.
    name: ${{ matrix.stage }}
    needs: changes
    if: >-
      ${{ !cancelled() && needs.changes.outputs.code != 'false' &&
      github.event_name != 'release' &&
      !(github.event_name == 'workflow_dispatch' && inputs.mode != 'merge') }}
    # Runner (task 539). A push to this repo, or a pull request whose head
    # branch lives in this repo, runs on the wslc container runners on TWE-001
    # (labels self-hosted, twe-001, wslc; org runner group 3, which allows this
    # public repo: timewarp-infrastructure 004). Everything else stays on ubuntu-latest:
    # fork pull requests (untrusted code; this repo is public) and
    # workflow_dispatch merge mode. A fork PR runs its own copy of this file and
    # can rewrite this line, so the real gate is the fork PR approval setting
    # (all_external_contributors, org and repo): approvers read the workflow
    # diff before approving. Set the repository variable CI_HOSTED_ONLY to true
    # to send every run to ubuntu-latest (runners offline) without a code change.
    runs-on: >-
      ${{ vars.CI_HOSTED_ONLY != 'true' &&
      (github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) &&
      fromJSON('["self-hosted", "twe-001", "wslc"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
    strategy:
      # Report every stage. A samples failure no longer hides the tests.
      fail-fast: false
      matrix:
        stage: [build, samples, test-multi, test-standalone]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history: attestation notes, version and tag checks

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
        with:
          # The wslc runners keep NuGet packages on a per-instance volume shared
          # with other repos' jobs (task 539). Saving that to this repo's
          # Actions cache would carry their packages, so only hosted runners
          # use the cache.
          nuget-cache: ${{ runner.environment == 'github-hosted' }}

      - name: Runner size
        run: nproc && free -h

      - name: Read OS codename
        # completion-31 (multi-mode phase) drives a fresh zsh, which the hosted
        # runner image does not ship. The apt mirror sometimes serves the debs
        # at 60 kB/s (1.5 to 5 minutes), so the debs are cached. The wslc image
        # bakes zsh and has no sudo, so it skips the cache and Install zsh
        # finds zsh already present (task 539).
        if: matrix.stage == 'test-multi' && runner.environment == 'github-hosted'
        id: os
        run: |
          $ErrorActionPreference = 'Stop'
          $line = Get-Content /etc/os-release | Where-Object { $_ -match '^VERSION_CODENAME=' } | Select-Object -First 1
          $codename = ''
          if ($line) { $codename = ($line -replace '^VERSION_CODENAME=', '').Trim('"', "'") }
          Write-Output "codename=$codename" >> $env:GITHUB_OUTPUT

      - name: Cache zsh packages
        if: matrix.stage == 'test-multi' && runner.environment == 'github-hosted'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/zsh-debs
          key: zsh-debs-${{ runner.os }}-${{ runner.arch }}-${{ steps.os.outputs.codename }}-v1

      - name: Install zsh
        if: matrix.stage == 'test-multi'
        env:
          DEBS: ${{ runner.temp }}/zsh-debs
        run: |
          $ErrorActionPreference = 'Stop'
          if (Get-Command zsh -ErrorAction SilentlyContinue) {
            Write-Output 'zsh is already installed.'
            exit 0
          }
          $debs = @(Get-ChildItem -Path $env:DEBS -Filter '*.deb' -ErrorAction SilentlyContinue)
          if ($debs.Count -gt 0) {
            sudo dpkg -i @($debs.FullName)
            if ($LASTEXITCODE -eq 0) {
              Write-Output 'Installed zsh from the cached packages.'
              exit 0
            }
          }
          Write-Output 'No usable cached zsh packages; installing from apt.'
          sudo apt-get update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -Recurse -Force -Path $env:DEBS -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $env:DEBS | Out-Null
          Push-Location $env:DEBS
          try {
            apt-get download zsh zsh-common
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
          $downloaded = @(Get-ChildItem -Path $env:DEBS -Filter '*.deb')
          sudo apt-get install -y @($downloaded.FullName)
          exit $LASTEXITCODE

      - name: Install dotnet-coverage
        # The test legs collect Cobertura through Jaribu runfile coverage
        # (task 574): `dev workflow` sets JARIBU_COVERAGE=1 under GitHub Actions
        # and RunAllTests relaunches the runner under dotnet-coverage.
        if: startsWith(matrix.stage, 'test-')
        run: |
          dotnet tool install --global dotnet-coverage
          exit $LASTEXITCODE

      - name: Run CI stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: dotnet run --file tools/dev-cli/dev.cs -- workflow --stage ${{ matrix.stage }}

      - name: Upload coverage
        # One artifact per test leg so the two legs do not collide.
        # Line-rate gate (ci-code-coverage.min-line) is not set yet (task 574).
        if: success() && startsWith(matrix.stage, 'test-')
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.stage }}
          path: artifacts/coverage
          if-no-files-found: warn

      - name: DevCli consumer check
        # DevCli ships C# source that consumers compile with their own analyzers.
        # Nuru builds it under its own .editorconfig, so RCS1194 (hidden there)
        # reached consumers first (tasks 558, 562). The check compiles the
        # content as a consumer would, without the repo .editorconfig and with
        # CA1812 on (task 573).
        if: matrix.stage == 'samples'
        working-directory: tests/devcli-consumer-check
        run: dotnet build

      - name: Stage packages for the ci job
        # Green master only (see the ci job). The ci job uploads these bytes as
        # Packages-<run_number> once every stage passed, then deletes this one.
        # The name must not start with Packages-: release locate-run takes any
        # Packages-* artifact of a successful run.
        if: matrix.stage == 'build' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: staged-packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
          # Kept for `gh run rerun --failed` of a red run; a green run deletes it.
          retention-days: 3

  ci:
    # Required check. Needs every stage and fails unless all of them passed.
    # Skipped exactly when changes says code=false (a skipped job reports
    # success) and on release and probe runs, which have no stages. always()
    # rather than !cancelled(): a cancelled run must fail this check, not skip it.
    needs: [changes, stage, green-key]
    if: >-
      ${{ always() && needs.changes.outputs.code != 'false' &&
      github.event_name != 'release' &&
      !(github.event_name == 'workflow_dispatch' && inputs.mode != 'merge') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write: keep-last-two prune deletes older Packages-* artifacts and the
      # staged-packages artifact.
      actions: write

    steps:
      - name: Checkout repository
        # The finish step compiles dev workflow and writes the marker file.
        # fetch-depth 1 is enough: it does not recompute the key.
        # continue-on-error: a checkout flake must not fail the required check
        # or skip the Packages-* upload. Finish runs only after this step.
        id: green-key-checkout
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup .NET
        id: green-key-setup
        if: steps.green-key-checkout.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/setup-dotnet

      - name: Finish green-key ledger
        # Shadow mode (task 540). Logs the end line, including false_skip when a
        # hit's full run failed, and stages a marker after success. continue-on-error
        # so the ledger cannot fail the required ci check. Runs before require so a
        # red matrix still records false_skip. !cancelled(): a cancelled run skips
        # checkout, and this step would otherwise compile with no tree. A cancelled
        # stage that still reaches this step logs pipeline=cancelled (rate=out,
        # false_skip=false), not a false skip. ci-finish-seconds is the compile
        # this step adds on the ci critical path.
        id: green-key-finish
        if: >-
          ${{ !cancelled() &&
          steps.green-key-checkout.outcome == 'success' &&
          steps.green-key-setup.outcome == 'success' &&
          (needs.changes.outputs.green_key != '' || needs['green-key'].outputs.green_key != '') }}
        continue-on-error: true
        env:
          GREEN_KEY: ${{ needs.changes.outputs.green_key || needs['green-key'].outputs.green_key }}
          GREEN_KEY_EARLIER: ${{ needs.changes.outputs.green_key_earlier || needs['green-key'].outputs.green_key_earlier }}
          GREEN_KEY_WRITER: ${{ needs.changes.outputs.green_key_writer || needs['green-key'].outputs.green_key_writer }}
          GREEN_KEY_PIPELINE: ${{ needs.stage.result == 'success' && 'succeeded' || needs.stage.result == 'cancelled' && 'cancelled' || 'failed' }}
        run: |
          $watch = [Diagnostics.Stopwatch]::StartNew()
          dotnet run --file tools/dev-cli/dev.cs -- workflow --stage green-key-finish
          $code = $LASTEXITCODE
          Write-Output ("green-key-v1 ci-finish-seconds=" + [int][Math]::Ceiling($watch.Elapsed.TotalSeconds))
          exit $code

      - name: Require every stage
        env:
          STAGE_RESULT: ${{ needs.stage.result }}
        run: |
          Write-Output "stage result: $($env:STAGE_RESULT)"
          if ($env:STAGE_RESULT -ne 'success') {
            Write-Output "::error::A CI stage did not succeed ($($env:STAGE_RESULT))."
            exit 1
          }

      - name: Upload green-key marker
        # Same-repo full success only. The finish step sets the output when it
        # staged artifacts/green-key/marker.json. A marker failure must not fail ci.
        if: success() && steps['green-key-finish'].outputs.green_key_artifact != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps['green-key-finish'].outputs.green_key_artifact }}
          path: artifacts/green-key/marker.json
          retention-days: 90
          if-no-files-found: warn

      - name: Download staged packages
        if: github.ref == 'refs/heads/master'
        uses: actions/download-artifact@v8
        with:
          name: staged-packages
          path: artifacts/packages

      - name: Upload Artifacts
        # Green master only: 458-002 promotes Packages-* from a push run at the
        # tag SHA. PR / always() uploads filled the org quota. Failed runs never
        # reach this step; release and probe runs have no ci job. The bytes are
        # the build stage's verified Release packages.
        id: upload-packages
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: Packages-${{ github.run_number }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
          retention-days: 7

      - name: Keep last two Packages artifacts
        if: success() && steps.upload-packages.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT: Packages-${{ github.run_number }}
        run: |
          $ErrorActionPreference = 'Stop'
          $query = '.artifacts[] | select((.name | startswith("Packages-")) and (.expired == false)) | {created_at, id, name} | tojson'
          $listed = gh api --paginate -H 'Accept: application/vnd.github+json' "/repos/$($env:GITHUB_REPOSITORY)/actions/artifacts?per_page=100" --jq $query
          if ($LASTEXITCODE -ne 0) { throw 'gh api failed to list the Actions artifacts.' }
          $artifacts = @($listed | Where-Object { $_ } | ForEach-Object { $_ | ConvertFrom-Json })
          if (-not ($artifacts | Where-Object { $_.name -eq $env:EXPECTED_ARTIFACT })) {
            Write-Output "Just-uploaded artifact $($env:EXPECTED_ARTIFACT) is not listed yet; skipping prune (keep-last-2 runs on the next green master push)."
            exit 0
          }
          $keep = 2
          $sorted = @($artifacts | Sort-Object -Property @{ Expression = { [datetime]$_.created_at }; Descending = $true }, @{ Expression = { [long]$_.id }; Descending = $true })
          for ($index = 0; $index -lt $sorted.Count; $index++) {
            $artifact = $sorted[$index]
            if ($index -lt $keep) {
              Write-Output "Keeping $($artifact.name) (id=$($artifact.id), created=$($artifact.created_at))"
              continue
            }
            Write-Output "Deleting $($artifact.name) (id=$($artifact.id), created=$($artifact.created_at))"
            gh api --method DELETE "/repos/$($env:GITHUB_REPOSITORY)/actions/artifacts/$($artifact.id)" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Delete of $($artifact.name) (id=$($artifact.id)) failed." }
          }

      - name: Delete staged packages
        # Storage only; a leftover expires with its retention.
        if: success() && steps.upload-packages.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ids = @(gh api "/repos/$($env:GITHUB_REPOSITORY)/actions/runs/$($env:RUN_ID)/artifacts?per_page=100" `
            --jq '.artifacts[] | select(.name == "staged-packages") | .id' | Where-Object { $_ })
          if ($LASTEXITCODE -ne 0) { throw 'gh api failed to list the run artifacts.' }
          foreach ($id in $ids) {
            Write-Output "Deleting staged-packages (id=$id)"
            gh api --method DELETE "/repos/$($env:GITHUB_REPOSITORY)/actions/artifacts/$id"
            if ($LASTEXITCODE -ne 0) { throw "Delete of staged-packages (id=$id) failed." }
          }

  release:
    # Release event, break-glass dispatch (mode=release) and the trusted
    # publishing probe. Release mode builds nothing: it promotes the Packages-*
    # artifact from the successful CI run of the tagged commit.
    if: >-
      ${{ github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'release' || inputs.mode == 'probe')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for NuGet Trusted Publishing (OIDC)
      actions: read    # locate-run lists runs and downloads the Packages-* artifact

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history required for the release gate's tag/ancestor checks (git merge-base, tag-pin, ls-remote comparisons)

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Validate break-glass confirmation
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'release' && inputs.confirm != 'release'
        run: |
          echo "::error::mode=release requires confirm=release. Refusing to run a break-glass release."
          exit 1

      - name: NuGet login (OIDC Trusted Publishing)
        id: nuget-login
        uses: nuget/login@v1
        with:
          user: TimeWarp.Enterprises

      - name: Trusted publishing probe result
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'probe'
        run: echo "Trusted publishing OK — OIDC exchange succeeded for this repo + workflow.yml. (A failure of the NuGet login step above means the policy is missing or misconfigured on NuGet.org.)"

      - name: Run release pipeline
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release' && inputs.confirm == 'release')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ('${{ github.event_name }}' -eq 'release') {
            dotnet run --file tools/dev-cli/dev.cs -- workflow --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          } else {
            dotnet run --file tools/dev-cli/dev.cs -- workflow --mode release --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          }
          exit $LASTEXITCODE
